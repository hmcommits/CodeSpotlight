<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeSpotlight — AI-powered GitHub portfolio showcase. Turn your repositories into stunning Bento Box project cards with automated technical case studies.">
  <meta name="keywords" content="github portfolio, developer showcase, AI code analysis, bento box UI, flutter web">

  <!-- Open Graph -->
  <meta property="og:title" content="CodeSpotlight — AI GitHub Showcase">
  <meta property="og:description" content="Turn your GitHub repos into stunning AI-powered portfolio cards.">
  <meta property="og:type" content="website">

  <!-- iOS meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodeSpotlight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>CodeSpotlight — AI GitHub Showcase</title>

  <!-- Mermaid.js v11 — async render API -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        darkMode: true,
        fontFamily: 'Inter, sans-serif',
        flowchart: { curve: 'basis', htmlLabels: true },
        themeVariables: {
          background: '#1A1A1A',
          mainBkg: '#1A1A1A',
          nodeBorder: '#6C63FF',
          lineColor: '#6C63FF',
          primaryColor: '#1A1A1A',
          primaryTextColor: '#F0F0F0',
          primaryBorderColor: '#6C63FF',
          secondaryColor: '#252525',
          tertiaryColor: '#2A2A2A',
          edgeLabelBackground: '#1A1A1A',
        }
      });
    });

    // Called from Flutter via dart:js_interop
    // Returns a Promise<string> of the rendered SVG or empty string on error
    async function renderMermaidSafe(elementId, graphDef) {
      try {
        const { svg } = await mermaid.render(elementId, graphDef);
        return svg;
      } catch (e) {
        console.error('Mermaid render error:', e);
        return '';
      }
    }
  </script>

  <style>
    /* Remove white flash before Flutter loads */
    body {
      margin: 0;
      background-color: #0D0D0D;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
