name: codespotlight
description: "AI-integrated Flutter Web portfolio showcase — turns GitHub repos into stunning Bento Box project cards."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Typography
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Images
  cached_network_image: ^3.4.1

  # URL handling
  url_launcher: ^6.3.1

  # Web DOM interop (for Mermaid.js rendering)
  web: ^1.1.0

  # Client-side routing — enables /project/:id deep links
  go_router: ^14.8.1

  # Persistent storage — JWT token across refreshes
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
