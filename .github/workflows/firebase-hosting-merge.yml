name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
      - name: Build Web
        working-directory: frontend
        run: flutter build web --release --dart-define=BACKEND_URL="https://codespotlight.onrender.com/api"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODESPOTLIGHT_HM }}
          channelId: live
          projectId: codespotlight-hm
          entryPoint: frontend
