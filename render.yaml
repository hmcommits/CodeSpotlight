{
  "name": "CodeSpotlight",
  "version": "2",
  "services": [
    {
      "type": "web",
      "name": "codespotlight-backend",
      "runtime": "node",
      "rootDir": "backend",
      "buildCommand": "npm install",
      "startCommand": "npm start",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "3000" },
        { "key": "GITHUB_PAT", "sync": false },
        { "key": "GEMINI_API_KEY", "sync": false },
        { "key": "MONGODB_URI", "sync": false },
        { "key": "ALLOWED_ORIGIN", "sync": false }
      ],
      "healthCheckPath": "/api/health",
      "autoDeploy": true
    }
  ]
}
